<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" role="img" aria-labelledby="marginTitle marginDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="marginTitle">The gap the loss asks for, on a cosine scale</title>
<desc id="marginDesc">Two cosine axes from minus one to one. On the first, the expected outcome puts wrong answers at zero and the right answer at 0.95, a gap of 0.95. On the second, the actual outcome puts wrong answers around 0.75 and the right answer at 0.90, a gap of only 0.15, which is all the loss ever asked for.</desc>
<rect width="700" height="320" fill="#FBFAF7"/>

<!-- TOP AXIS: expected -->
<text x="60" y="34" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#6B655C">What you would expect</text>
<line x1="60" y1="95" x2="660" y2="95" stroke="#8A8378" stroke-width="1.2"/>
<g stroke="#C8C2B8" stroke-width="1">
  <line x1="60" y1="90" x2="60" y2="100"/><line x1="210" y1="90" x2="210" y2="100"/>
  <line x1="360" y1="90" x2="360" y2="100"/><line x1="510" y1="90" x2="510" y2="100"/>
  <line x1="660" y1="90" x2="660" y2="100"/>
</g>
<g font-family="ui-monospace,monospace" font-size="10" fill="#9C968C" text-anchor="middle">
  <text x="60" y="114">-1.0</text><text x="210" y="114">-0.5</text><text x="360" y="114">0.0</text>
  <text x="510" y="114">0.5</text><text x="660" y="114">1.0</text>
</g>
<rect x="348" y="68" width="24" height="22" rx="2" fill="#8A8378" opacity="0.5"/>
<text x="360" y="60" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#6B655C">wrong answers</text>
<circle cx="645" cy="79" r="6" fill="#2A6041"/>
<text x="645" y="60" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#2A6041">right</text>
<line x1="372" y1="79" x2="637" y2="79" stroke="#2A6041" stroke-width="1" stroke-dasharray="4 3"/>
<text x="505" y="74" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#2A6041">gap 0.95</text>

<!-- BOTTOM AXIS: actual -->
<text x="60" y="184" font-family="Georgia,serif" font-size="15" font-weight="700" fill="#123F5A">What the loss settles for</text>
<line x1="60" y1="245" x2="660" y2="245" stroke="#1A1815" stroke-width="1.2"/>
<g stroke="#C8C2B8" stroke-width="1">
  <line x1="60" y1="240" x2="60" y2="250"/><line x1="210" y1="240" x2="210" y2="250"/>
  <line x1="360" y1="240" x2="360" y2="250"/><line x1="510" y1="240" x2="510" y2="250"/>
  <line x1="660" y1="240" x2="660" y2="250"/>
</g>
<g font-family="ui-monospace,monospace" font-size="10" fill="#9C968C" text-anchor="middle">
  <text x="60" y="264">-1.0</text><text x="210" y="264">-0.5</text><text x="360" y="264">0.0</text>
  <text x="510" y="264">0.5</text><text x="660" y="264">1.0</text>
</g>
<rect x="561" y="218" width="39" height="22" rx="2" fill="#123F5A" opacity="0.35"/>
<text x="560" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#123F5A">wrong answers ~0.75</text>
<circle cx="630" cy="229" r="6" fill="#2A6041"/>
<text x="648" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#2A6041">right 0.90</text>
<line x1="600" y1="229" x2="624" y2="229" stroke="#9B2C2C" stroke-width="1.5"/>
<text x="612" y="290" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="600" fill="#9B2C2C">gap 0.15</text>
<line x1="612" y1="276" x2="612" y2="236" stroke="#9B2C2C" stroke-width="1" stroke-dasharray="3 3"/>

<rect x="60" y="272" width="330" height="30" rx="2" fill="#FBF0DA"/>
<text x="72" y="292" font-family="Georgia,serif" font-size="13" fill="#8A5A00">All the loss ever asked for was 0.15.</text>
</svg>
