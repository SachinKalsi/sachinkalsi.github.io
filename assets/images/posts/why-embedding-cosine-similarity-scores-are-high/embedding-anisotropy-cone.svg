<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" aria-labelledby="coneTitle coneDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="coneTitle">Isotropic embeddings versus the anisotropic cone</title>
<desc id="coneDesc">On the left, vectors point in all directions and two random ones average a cosine of zero. On the right, every vector leans in the same shared direction, so two random ones average 0.75 even though the angles between neighbours are the same.</desc>
<rect width="700" height="290" fill="#FBFAF7"/>

<!-- LEFT: isotropic -->
<text x="175" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#1A1815">What you would expect</text>
<g stroke="#6B655C" stroke-width="1.8" fill="none" stroke-linecap="round">
  <line x1="175" y1="175" x2="175" y2="75"/>
  <line x1="175" y1="175" x2="246" y2="104"/>
  <line x1="175" y1="175" x2="275" y2="175"/>
  <line x1="175" y1="175" x2="246" y2="246"/>
  <line x1="175" y1="175" x2="175" y2="275"/>
  <line x1="175" y1="175" x2="104" y2="246"/>
  <line x1="175" y1="175" x2="75" y2="175"/>
  <line x1="175" y1="175" x2="104" y2="104"/>
</g>
<circle cx="175" cy="175" r="4" fill="#1A1815"/>
<text x="175" y="282" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#6B655C">two random vectors average 0.00</text>

<!-- RIGHT: anisotropic cone -->
<text x="520" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#123F5A">What you actually get</text>
<path d="M520 245 L466 78 A 176 176 0 0 1 574 78 Z" fill="#123F5A" opacity="0.10"/>
<g stroke="#123F5A" stroke-width="1.8" fill="none" stroke-linecap="round">
  <line x1="520" y1="245" x2="478" y2="80"/>
  <line x1="520" y1="245" x2="494" y2="73"/>
  <line x1="520" y1="245" x2="512" y2="70"/>
  <line x1="520" y1="245" x2="530" y2="70"/>
  <line x1="520" y1="245" x2="548" y2="74"/>
  <line x1="520" y1="245" x2="564" y2="83"/>
  <line x1="520" y1="245" x2="470" y2="92"/>
</g>
<circle cx="520" cy="245" r="4" fill="#1A1815"/>
<line x1="600" y1="245" x2="600" y2="100" stroke="#8A8378" stroke-width="1" stroke-dasharray="3 3"/>
<text x="608" y="170" font-family="ui-monospace,monospace" font-size="11" fill="#8A8378">shared</text>
<text x="608" y="184" font-family="ui-monospace,monospace" font-size="11" fill="#8A8378">direction</text>
<text x="520" y="282" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#123F5A">two random vectors average 0.75</text>

<line x1="350" y1="60" x2="350" y2="255" stroke="#DDD8CE" stroke-width="1"/>
</svg>
