<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 636" width="700" height="636" role="img" aria-labelledby="pipeTitle pipeDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="pipeTitle">How an embedding model is trained, stage by stage</title>
<desc id="pipeDesc">Four stacked stages. A pretrained BERT base feeds into weak contrastive training, which uses 100 million to 1 billion lightly cleaned pairs, InfoNCE at temperature 0.01, batch size 32,768 and in-batch negatives only, and is marked as the stage that sets the score range. That feeds into supervised fine-tuning, which uses 1 to 2 million heavily cleaned pairs, InfoNCE plus KL distillation, temperature 0.01, batch size 256 and seven mined hard negatives. Last comes an optional task-specific stage.</desc>
<rect width="700" height="636" fill="#FBFAF7"/>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A544B"/>
  </marker>
</defs>

<!-- BASE -->
<rect x="60" y="22" width="580" height="60" rx="4" fill="#FFFFFF" stroke="#5A544B" stroke-width="1.6"/>
<text x="80" y="48" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#1A1815">Pretrained base model</text>
<text x="80" y="68" font-family="ui-monospace,monospace" font-size="11.5" fill="#6B655C">BERT or a variant &#183; already anisotropic &#183; no contrastive loss yet</text>
<line x1="350" y1="82" x2="350" y2="110" stroke="#5A544B" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- STAGE 1 -->
<rect x="60" y="114" width="580" height="142" rx="4" fill="#EEF4F7" stroke="#123F5A" stroke-width="2"/>
<rect x="60" y="114" width="580" height="30" rx="4" fill="#123F5A"/>
<rect x="60" y="136" width="580" height="8" fill="#123F5A"/>
<text x="80" y="135" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#FFFFFF">Stage 1 &#183; Weak contrastive training</text>
<g font-family="ui-monospace,monospace" font-size="12">
  <text x="80" y="167" fill="#6B655C">data</text>        <text x="196" y="167" fill="#1A1815">100M to 1B pairs, lightly cleaned</text>
  <text x="80" y="188" fill="#6B655C">loss</text>        <text x="196" y="188" fill="#1A1815">InfoNCE</text>
  <text x="80" y="209" fill="#6B655C">temperature</text> <text x="196" y="209" fill="#9B2C2C" font-weight="600">0.01</text>
  <text x="80" y="230" fill="#6B655C">batch size</text>  <text x="196" y="230" fill="#1A1815">32,768</text>
  <text x="80" y="247" fill="#6B655C">negatives</text>   <text x="196" y="247" fill="#1A1815">in-batch only, no hard negatives</text>
</g>
<rect x="436" y="190" width="186" height="50" rx="3" fill="#FBE7E7" stroke="#9B2C2C" stroke-width="1.2"/>
<text x="529" y="211" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="700" fill="#9B2C2C">this stage sets</text>
<text x="529" y="228" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="700" fill="#9B2C2C">your score range</text>
<line x1="350" y1="256" x2="350" y2="284" stroke="#5A544B" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- STAGE 2 -->
<rect x="60" y="288" width="580" height="142" rx="4" fill="#FFFFFF" stroke="#5A544B" stroke-width="1.6"/>
<rect x="60" y="288" width="580" height="30" rx="4" fill="#5A544B"/>
<rect x="60" y="310" width="580" height="8" fill="#5A544B"/>
<text x="80" y="309" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#FFFFFF">Stage 2 &#183; Supervised fine-tuning</text>
<g font-family="ui-monospace,monospace" font-size="12">
  <text x="80" y="341" fill="#6B655C">data</text>        <text x="196" y="341" fill="#1A1815">1M to 2M pairs, heavily cleaned</text>
  <text x="80" y="362" fill="#6B655C">loss</text>        <text x="196" y="362" fill="#1A1815">InfoNCE, often plus KL distillation</text>
  <text x="80" y="383" fill="#6B655C">temperature</text> <text x="196" y="383" fill="#1A1815">0.01</text>
  <text x="80" y="404" fill="#6B655C">batch size</text>  <text x="196" y="404" fill="#1A1815">256</text>
  <text x="80" y="421" fill="#6B655C">negatives</text>   <text x="196" y="421" fill="#1A1815">7 mined hard negatives per example</text>
</g>
<line x1="350" y1="430" x2="350" y2="458" stroke="#5A544B" stroke-width="1.6" marker-end="url(#ar)"/>

<!-- STAGE 3 -->
<rect x="60" y="462" width="580" height="86" rx="4" fill="#FFFFFF" stroke="#9C968C" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="80" y="490" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#5A544B">Stage 3 &#183; Task specific (optional)</text>
<g font-family="ui-monospace,monospace" font-size="12">
  <text x="80" y="516" fill="#6B655C">goal</text> <text x="196" y="516" fill="#1A1815">Matryoshka embeddings &#183; quantisation</text>
  <text x="196" y="535" fill="#1A1815">instruction support</text>
</g>

<text x="60" y="584" font-family="Georgia,serif" font-size="12" fill="#8A8378">Numbers are from the E5 paper. Other models differ: MiniLM uses a scale of 20, which is</text>
<text x="60" y="602" font-family="Georgia,serif" font-size="12" fill="#8A8378">temperature 0.05. Check the model card for whichever one you use.</text>
</svg>
