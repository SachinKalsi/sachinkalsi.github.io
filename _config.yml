# Site Settings
title: "Sachin Kalsi | LLM & NLP"
description: "Specializing in Large Language Models, Semantic Search, and Generative AI."
url: "https://sachinkalsi.github.io" # Your site URL
baseurl: "" # Subpath of your site
timezone: Asia/Kolkata
lang: en-US
keywords:
  - Sachin Kalsi
  - Data Science Architect
  - NLP
  - Large Language Models
  - LLM
  - Generative AI
  - Semantic Search
  - Machine Learning

# Default social preview image (used when a page declares no `image:` of its own)
og_image: "/assets/images/og-default.png"
og_image_width: 1200
og_image_height: 630
og_image_alt: "Sachin Kalsi — Data Science Architect, NLP"

# Google Analytics (GA4)
# Get your Measurement ID from: https://analytics.google.com/
# Format: G-XXXXXXXXXX
google_analytics: "G-SPBSTYD46G" # Google Analytics Measurement ID

# Author Information
author:
  name: "Sachin Kalsi"
  # Single source of truth for the role shown in the hero and in Person JSON-LD.
  role: "Principal Data Scientist | LLM & NLP Systems"
  email: "sachinkalsi15@gmail.com"
  location: "Bengaluru, India"
  linkedin: "https://www.linkedin.com/in/sachinkalsi/"
  github: "https://github.com/sachinkalsi"
  medium: "https://medium.com/@sachinkalsi"
  youtube: "https://www.youtube.com/@sachin_kalsi"

# Jekyll Settings
markdown: kramdown
highlighter: rouge

sass:
  style: compressed

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Blog Settings
permalink: /blog/:title/

# Default SEO values
defaults:
  - scope:
      path: ""
    values:
      author: "Sachin Kalsi"
      robots: "index, follow"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Sachin Kalsi"

# Include directories (ensure blog directory is processed)
include:
  - blog

# Exclude files from processing
exclude:
  - .DS_Store
  - README.md
  - BLOG_POST_TEMPLATE.md
  - GOOGLE_ANALYTICS_SETUP.md
  - DESIGN.md
  - PRODUCT.md
  - .impeccable
  - .github
  - assets/images/README.md
  - blog-simple.html
  - blog-static.html
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
